name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests need pytest and openai (for its exception classes); Whisper and yt-dlp are imported lazily by the app.
      - run: pip install pytest "openai>=3.35.1"
      - run: python -m pytest -q -rs
      - name: Colab notebook is in sync with whisper_server.py
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python colab/build_notebook.py
          git diff --exit-code colab/Whisper_Server.ipynb
